name: Feature request
description: Propose a focused addition or workflow improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe what is slow or difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, keyboard, and launcher
  - type: textarea
    id: tradeoffs
    attributes:
      label: Permissions, performance, or compatibility concerns
